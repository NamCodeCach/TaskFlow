# ==========================================
# SQL Server Express – SQL Server Authentication
# TCP/IP port 1433
# ==========================================

# Kết nối qua TCP port 1433 – SQL Server Authentication (không cần DLL Windows Auth)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=taskflow_db;encrypt=false;trustServerCertificate=true;
spring.datasource.username=HoangNam
spring.datasource.password=123456789
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

# ==========================================
# File Upload
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads/submissions

# ==========================================
# Server
# ==========================================
server.port=8080

# ==========================================
# Logging
# ==========================================
logging.level.com.network.kanban=DEBUG
logging.level.org.springframework.web=INFO
